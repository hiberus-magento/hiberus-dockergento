schema: spec-driven

context: |
  Hiberus Dockergento (`hm`): CLI que gestiona entornos Docker de desarrollo para
  Magento 2 / Adobe Commerce. Traduce comandos propios a `docker compose` sobre un stack
  de 9 servicios (phpfpm, nginx, db, search, redis, varnish, hitch, mailhog, rabbitmq).

  Implementation: **Go binary + Bash, migration in progress** (not 100% Bash anymore).
    Go module `github.com/hiberus-magento/hiberus-dockergento` (go 1.25), built with
    `.goreleaser.yaml` from `cmd/hm`. What already moved to Go replaces the equivalent
    Bash command; what has not yet moved still runs from `console/`.
    - `cmd/hm/main.go` — Go binary entry point
    - `internal/cli/` — Cobra command wiring, output, wrappers already ported to Go
    - `internal/api/` — local HTTP/dashboard server
    - `dockergento/` — Go core: `core/` (domain logic), `app/` (use cases),
      `adapters/` (docker, compose, fs, registry, git, machine, traefik, legacy Bash
      bridge), `ports/`, `contract/`
    - `dockergento/adapters/legacy/` — bridges to Bash commands not yet ported
    - `test/e2e/` — Go end-to-end suite driving the built `hm` binary against real Docker
    - `bin/run` — router de comandos Bash y punto de entrada legacy
    - `console/commands/*.sh` — un fichero por comando aún no migrado
    - `console/tasks/*.sh` — funciones reutilizables
    - `console/helpers/*.sh` — utilidades (docker, properties, versiones, argumentos)
    - `console/components/*.sh` — E/S (print_message.sh, input_info.sh)
    - `data/*.json` — configuración (requirements, properties, command_descriptions)
    - `docker-compose/*.template.yml` — plantillas de compose
    - `Dockerfiles/<servicio>/<versión>/` — imágenes propias, publicadas en Docker Hub
      mediante `.github/workflows/dockerhub-publish.yml`
    - `MIGRATION.md` — estado y plan de la migración Bash → Go

  Convenciones de código:
    - `#!/usr/bin/env bash` y `set -euo pipefail` en todos los scripts
    - Salida siempre vía `console/components/print_message.sh`
      (print_info, print_error, print_warning, print_processing, print_code, print_link)
    - Opciones con `getopts`; comandos nuevos requieren entrada en
      `data/command_descriptions.json` y un `docs/<comando>.md`
    - `jq` para todo el manejo de JSON
    - Diferencias de plataforma vía `$MACHINE` (mac | linux) y los overlays
      `docker-compose.dev.mac.yml` / `docker-compose.dev.linux.yml`
    - Comentarios y documentación de usuario en inglés; investigación interna en español
    - Cambios de release: fichero en `changelogs/vX.Y.Z.md` y entrada en `changelogs/README.md`

  Contexto de producto (ver `docs/research/backlog.md` para el detalle y los IDs):
    - Objetivo transversal: soportar trabajo en paralelo con varios agentes de IA sobre el
      mismo repositorio (git worktrees) sin que se pisen los entornos.
    - Decisiones tomadas: seguimos con Dockergento (no migramos a Warden ni DDEV);
      TUI antes que dashboard web; `share` con Cloudflared, no ngrok; `hm` nunca llama a
      modelos de IA; sin registro de add-ons; sin Portainer; la futura web no implementa
      lógica de negocio, sólo consume el contrato JSON de la CLI.
    - Problema conocido y aún abierto: dos proyectos Dockergento no pueden estar levantados
      a la vez porque cada uno publica los puertos 80, 443, 3306, 9200, 8025, 5672 y 15672.

strict_tdd: true

# One workspace-level project: the repository root (Go module + Bash console/).
# `tests/run.sh` (no args) is the single command that covers both stacks, so
# strict TDD is enabled workspace-wide (see sdd/hiberus-dockergento/testing-capabilities).
testing:
  projects:
    - path: "."
      stack: "Go 1.25 (cmd/hm, internal/, dockergento/) + Bash (bin/run, console/)"
      test_command: "tests/run.sh"
      framework: "Go testing + tests/lib/assert.sh"
  test_command: "tests/run.sh"
  build_command: "go build -o bin/hm ./cmd/hm"
  coverage_threshold: 0
  notes: >
    `tests/run.sh` with no argument runs `go test ./...` (dockergento/, internal/,
    cmd/, and the Go-based test/e2e suite) and then every `*_test.sh` under tests/
    (unit, integration, performance). `tests/run.sh tests/unit` runs only the Bash
    unit suites (what CI runs, since integration/performance need a real Docker
    project). `tests/run.sh --shell` skips the Go suite; a single file also runs
    standalone. CI (`.github/workflows/go.yml`) additionally runs `gofmt -l ./cmd
    ./internal` and `go vet ./...` before `go test ./... -race`.

rules:
  proposal:
    - Enlaza el ID del backlog (`docs/research/backlog.md`) al que corresponde el cambio.
    - Incluye siempre una sección de "Non-goals".
    - Indica si el cambio afecta a proyectos existentes y si necesita migración.
  tasks:
    - Tareas de como mucho medio día.
    - Incluye siempre una tarea de documentación (`docs/<comando>.md` y
      `data/command_descriptions.json`) cuando se añade o cambia un comando.
    - Incluye siempre una tarea de verificación manual con un proyecto real.
  design:
    - "Justifica cualquier dependencia externa nueva: en Bash puro es preferible."
    - Describe el comportamiento en mac y en linux cuando difieran.
  apply:
    guidelines:
      - "Sigue los patrones existentes: hexagonal en dockergento/ (core/app/adapters/ports),
        wrappers Cobra en internal/cli/, Bash con `set -euo pipefail` y
        console/components/print_message.sh para toda la salida en lo que quede sin portar."
      - "Todo comando que se porta a Go llega con sus tests de shell portados y el mismo
        contrato (códigos de salida, `--json`, preguntas) — ver MIGRATION.md."
    tdd: true
    test_command: "tests/run.sh"
  verify:
    test_command: "tests/run.sh"
    build_command: "go build -o bin/hm ./cmd/hm"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.

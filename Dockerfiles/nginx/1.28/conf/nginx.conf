worker_processes 2;

#
# `debug` writes a paragraph per request and needs nginx built with --with-debug to mean anything.
# On a development machine it fills the log with noise nobody reads and slows every request down.
#
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  #
  # nginx reserves the connection pool when it starts, so this number is memory, not a limit that
  # costs nothing until it is reached: at 1048576 each container held 884 MB of anonymous memory
  # with nothing connected to it — measured on an idle container whose processes summed 9.5 MB of
  # RSS. On a machine running several environments at once that was the whole memory budget.
  #
  # 1024 per worker is two thousand simultaneous connections on a development machine, which is
  # more than a development machine will ever see, and it costs 3 MB.
  #
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20M;
  include /etc/nginx/conf.d/*.conf;
}
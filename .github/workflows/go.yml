name: go

#
# Every push to main or a release branch, and every pull request: with a binary, a bad commit breaks
# everybody who pulls, so nothing reaches those branches unchecked.
#
on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request makes the run in progress pointless: it is cancelled, so the queue
# holds the commit that matters and not three stale ones before it. On main and release branches
# every commit keeps its run, and with it a verdict to bisect by: the group is the commit itself,
# because a shared group keeps only one waiting run and drops the others even without cancelling.
concurrency:
  group: go-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    #
    # Both, and macOS is not decoration: the tool has code that only runs there (the
    # copy-from-container branch, the platform checks), and a test gated on runtime.GOOS does not
    # fail on the other platform, it does not run. `hm debug-on --json` once shipped a double JSON
    # envelope on macOS for exactly that reason.
    #
    # Linux is the one with a Docker daemon, so test/e2e only runs for real there; on macOS those
    # tests skip.
    #
    # A label of a fixed version rather than macos-latest, so that the image does not change under
    # the job without a commit saying so.
    #
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    runs-on: ${{ matrix.os }}

    # The whole job takes a few minutes; anything longer is a hang, and without a limit a hang
    # holds the runner for GitHub's six hours
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # 1.25 because the Docker SDK's dependency graph asks for it (otel and grpc-gateway
          # declare it). Only building needs it; the binary runs anywhere.
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./dockergento ./test)
          if [ -n "$unformatted" ]; then
            echo "Not formatted:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

      - name: build
        run: go build -o bin/hm ./cmd/hm

      # The shell suites that need no daemon: the installer, the docs and help checks, the
      # migration table. The argument is `unit`, not `tests/unit`, which run.sh would not find.
      - name: shell suites (unit)
        run: ./tests/run.sh unit

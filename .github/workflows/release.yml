name: release

#
# Tags carry no "v": 2.0.0, 2.0.0-rc.1. Binaries exist only from 2.0, the first version that is a Go
# program (cmd/hm); 1.x is the shell tool and has nothing to build. The filters are globs, where "."
# is literal and "*" is anything but "/": the first takes 2.x to 9.x, pre-releases included, the
# second 10.x to 99.x, and neither takes 1.5.1 or 1.6.0-rc.2 (a 1 followed by "." matches neither).
#
on:
  push:
    tags:
      - "[2-9].*"
      - "[1-9][0-9].*"

permissions:
  contents: read

jobs:
  #
  # The tagged tree passes its tests before anything is published: a tag pushed on a red commit
  # stops here, and no binary of it ever reaches `hm update` or the installer.
  #
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      go: ${{ steps.guard.outputs.go }}

    steps:
      - uses: actions/checkout@v7

      # Belt and braces behind the filters: a tagged tree without the Go program has no binaries to
      # publish, so the workflow ends here, successfully, and publishes nothing
      - name: The tagged tree is a Go version
        id: guard
        run: |
          if [ -d cmd/hm ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} has no cmd/hm: a version of the shell tool, nothing is published"
          fi

      - uses: actions/setup-go@v7
        if: steps.guard.outputs.go == 'true'
        with:
          go-version: "1.25"
          # No cache: a tag run can only restore caches of its own ref or of the default branch,
          # so every tag missed and saved ~1 GB nobody read again, filling the 10 GB quota
          cache: false

      - name: go vet
        if: steps.guard.outputs.go == 'true'
        run: go vet ./...

      - name: go test
        if: steps.guard.outputs.go == 'true'
        run: go test ./... -race

      - name: shell suites (unit)
        if: steps.guard.outputs.go == 'true'
        run: ./tests/run.sh unit

  #
  # On macOS, and not on Linux, for one reason: Compose's file watcher reaches macOS's FSEvents
  # through cgo, so a darwin binary cannot be cross-compiled with cgo off — it fails to build at
  # all. A macOS runner produces all four: darwin natively and for the other architecture through
  # Apple's toolchain, and linux with cgo off, which cross-compiles from anywhere.
  #
  binaries:
    needs: test
    if: needs.test.outputs.go == 'true'

    runs-on: macos-15

    # Tests and build take about fifteen minutes; the limit only stops a hang from holding the
    # runner for six hours. A job GitHub cannot give a runner to is cancelled on its side, and is
    # re-run with `gh run rerun <id> --failed`: the tag stays, nothing was published.
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # setup-go caches by default; off for the same reason as in the test job
          cache: false

      # The test job ran on Linux; the code that only runs on macOS is tested here, on the machine
      # that builds the darwin binaries, before they are published
      - name: go test (macOS)
        run: go test ./...

      - name: Both platforms build before anything is published
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build ./...
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
